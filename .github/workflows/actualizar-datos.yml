name: Actualizar datos y publicar

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar SECOP II y generar data.json
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python etl/build_data.py
      - name: Guardar data.json en el repositorio
        run: |
          git config user.name "marea-publica-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || git commit -m "Datos SECOP II $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: datos
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
