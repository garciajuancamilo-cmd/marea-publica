name: Leer métricas de redes

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "bot/metricas.py"
      - ".github/workflows/metricas.yml"

permissions:
  contents: write

jobs:
  metricas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leer métricas (sin publicar)
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python bot/metricas.py
      - name: Guardar en la rama "metricas"
        run: |
          cd estado
          git init -q -b metricas
          git config user.name "marea-bot"
          git config user.email "marea-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Métricas $(date -u +%FT%H:%MZ)"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" metricas
