name: Video de prueba (resumen semanal)

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script de video"
        default: "render_semana"
  push:
    branches: [main]
    paths:
      - "video/**"
      - ".github/workflows/video-prueba.yml"

permissions:
  contents: write

concurrency:
  group: video
  cancel-in-progress: true

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q pillow
      - name: Generar video
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python video/${{ github.event.inputs.script || 'render_semana' }}.py salida/${{ github.event.inputs.script || 'render_semana' }}.mp4
      - name: Guardar en la rama "videos"
        run: |
          cp site/data.json salida/ 2>/dev/null || true
          cd salida
          rm -f data.json
          git init -q -b videos
          git config user.name "marea-bot"
          git config user.email "marea-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Video de prueba $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" videos
